name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.VCT_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Without a release key, builds are signed with the debug key. Caching it keeps
      # the signature stable between runs so new APKs install over old ones.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Decode release signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VCT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          VCT_KEYSTORE_PASSWORD: ${{ secrets.VCT_KEYSTORE_PASSWORD }}
          VCT_KEY_ALIAS: ${{ secrets.VCT_KEY_ALIAS }}
          VCT_KEY_PASSWORD: ${{ secrets.VCT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "VCT-Tracker-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: VCT-Tracker-1.0.${{ github.run_number }}
          path: VCT-Tracker-1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VCT Tracker 1.0.${{ github.run_number }}
          body: |
            Install `VCT-Tracker-1.0.${{ github.run_number }}.apk` on your Android phone (Android 8.0+).
            Built from ${{ github.sha }}.
          files: VCT-Tracker-1.0.${{ github.run_number }}.apk
          make_latest: true
